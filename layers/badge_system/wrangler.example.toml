name = "vris-badge"
main = "worker/src/index.ts"
compatibility_date = "2026-07-22"

[dev]
ip = "127.0.0.1"
port = 8787

[assets]
directory = "frontend/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
APP_BASE_URL = "http://localhost:5173"
STAFF_AUTH_MODE = "shared_basic"
STAFF_ACCESS_USERNAME = "staff"

# Put local-only PUBLIC_TOKEN_SECRET and STAFF_ACCESS_PASSWORD in .dev.vars.
# Build frontend/dist before starting Wrangler (npm run build).

[[d1_databases]]
binding = "DB"
database_name = "vris_badge"
database_id = "replace-with-cloudflare-d1-database-id"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "ORDER_IMAGES"
bucket_name = "vris-badge-private"
