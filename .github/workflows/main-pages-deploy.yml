name: <Main> Deploy to Cloudflare Pages

on:
  push:
    branches: ['main']
    paths:
      - 'layers/main/**'
      - 'layers/base/**'
      - 'package.json'
      - 'bun.lock'
      - 'wrangler.jsonc'
      - '.github/workflows/main-pages-deploy.yml'
  workflow_dispatch:

concurrency:
  group: main-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Keep this workflow in the repo so main pushes use the reviewed Pages output.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build production Pages output
        run: target=production bun --filter vris-collaboration build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
        run: npx wrangler pages deploy layers/main/dist --project-name=vris-collaboration --branch=main --commit-hash=${{ github.sha }} --commit-message="$COMMIT_MESSAGE"
