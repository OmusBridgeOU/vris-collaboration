name: <VRIS 26 Autumn Access API> Deploy Worker

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ['main']
    paths:
      - 'layers/vris-26autumn-access-api/**'
      - '.github/workflows/vris-26autumn-access-api-worker.yml'
  push:
    branches: ['main']
    paths:
      - 'layers/vris-26autumn-access-api/**'
      - '.github/workflows/vris-26autumn-access-api-worker.yml'
  workflow_dispatch:

concurrency:
  group: vris-26autumn-access-api-worker
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Worker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Check Worker
        working-directory: layers/vris-26autumn-access-api
        run: bun run check

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy Worker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Deploy Worker
        working-directory: layers/vris-26autumn-access-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy
