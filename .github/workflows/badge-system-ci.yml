name: Badge System Deploy

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact locally verified main commit
        required: true
      evidence_sha256:
        description: SHA-256 of local-quality-evidence.json on draft quality-<commit> release
        required: true

permissions:
  contents: read

jobs:
  build:
    if: vars.BADGE_SYSTEM_PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layers/badge_system
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and local quality evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
        working-directory: .
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          mkdir -p evidence
          gh release download "quality-$SOURCE_COMMIT" --pattern local-quality-evidence.json --dir evidence
          python3 scripts/verify-deploy-evidence.py evidence/local-quality-evidence.json "$EVIDENCE_SHA256" "$SOURCE_COMMIT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: layers/badge_system/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Build deployment frontend
        run: pnpm --dir frontend build
      - name: Upload deployment frontend
        uses: actions/upload-artifact@v4
        with:
          name: badge_system_production_frontend
          path: layers/badge_system/frontend/dist
          retention-days: 1

  deploy:
    needs: build

    if: vars.BADGE_SYSTEM_PRODUCTION_DEPLOY_ENABLED == 'true'

    runs-on: ubuntu-latest

    environment: badge-system

    concurrency:
      group: badge_system_production_deployment
      cancel-in-progress: false

    defaults:
      run:
        working-directory: layers/badge_system

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: layers/badge_system/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Download deployment frontend
        uses: actions/download-artifact@v4
        with:
          name: badge_system_production_frontend
          path: layers/badge_system/frontend/dist

      - name: Prepare private deployment configuration
        run: node scripts/production_config.mjs "$RUNNER_TEMP/deployment_secrets.json"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PRODUCTION_CUSTOM_DOMAIN: ${{ vars.PRODUCTION_CUSTOM_DOMAIN }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          ORDER_IMAGES_BUCKET: ${{ vars.ORDER_IMAGES_BUCKET }}
          STAFF_ACCESS_USERNAME: ${{ vars.STAFF_ACCESS_USERNAME }}
          PUBLIC_TOKEN_SECRET: ${{ secrets.PUBLIC_TOKEN_SECRET }}
          STAFF_ACCESS_PASSWORD: ${{ secrets.STAFF_ACCESS_PASSWORD }}

      - name: Deploy assets and Worker
        run: >
          pnpm --dir frontend exec wrangler deploy
          --config ../wrangler.production.json
          --secrets-file "$RUNNER_TEMP/deployment_secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove generated deployment files
        if: always()
        run: >
          rm -f --
          wrangler.production.json
          "$RUNNER_TEMP/deployment_secrets.json"
