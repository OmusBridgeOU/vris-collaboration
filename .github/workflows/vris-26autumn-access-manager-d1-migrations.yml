name: <VRIS 26 Autumn Access Manager> D1 and API

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ['main']
    paths:
      - 'layers/vris-26autumn-access-manager/**'
      - '.github/workflows/vris-26autumn-access-manager-d1-migrations.yml'
  push:
    branches: ['main']
    paths:
      - 'layers/vris-26autumn-access-manager/**'
      - '.github/workflows/vris-26autumn-access-manager-d1-migrations.yml'
  workflow_dispatch:
    inputs:
      deploy_remote:
        description: Apply remote D1 migrations and deploy the Worker
        required: true
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate D1 and Worker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Check Worker and D1 config
        working-directory: layers/vris-26autumn-access-manager
        run: bun run check

  d1-migrate:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_remote
    runs-on: ubuntu-latest
    name: Apply remote D1 migrations
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply remote migrations
        working-directory: layers/vris-26autumn-access-manager
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run d1:migrate:remote

  deploy-worker:
    needs: d1-migrate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_remote
    runs-on: ubuntu-latest
    name: Deploy Worker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Deploy Worker
        working-directory: layers/vris-26autumn-access-manager
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy
