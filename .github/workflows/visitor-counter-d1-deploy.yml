name: <Visitor Counter> D1 and API

on:
  workflow_dispatch:
    inputs:
      deploy_remote:
        description: Apply remote D1 migrations and deploy the Worker
        required: true
        type: boolean
        default: false

concurrency:
  group: visitor-counter-d1-deploy
  cancel-in-progress: false

jobs:
  d1-migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_remote
    runs-on: ubuntu-latest
    name: Apply remote D1 migrations
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply remote migrations
        working-directory: layers/visitor-counter
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run d1:migrate:remote

  deploy-worker:
    needs: d1-migrate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_remote
    runs-on: ubuntu-latest
    name: Deploy Worker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Deploy Worker
        working-directory: layers/visitor-counter
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy
