version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # Vitest 5 is incompatible with the current @fast-check/vitest integration.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/*'
        update-types:
          - version-update:semver-major
      # TypeScript 7 currently fails the Nuxt/vue-tsc check and lint pipeline.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
